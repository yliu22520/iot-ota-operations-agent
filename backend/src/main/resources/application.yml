spring:
  application:
    name: iot-ota-operations-agent
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ota_operations}
    username: ${SPRING_DATASOURCE_USERNAME:ota}
    password: ${SPRING_DATASOURCE_PASSWORD:ota}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
demo:
  operator:
    username: ${DEMO_OPERATOR_USERNAME:demo-operator}
    password: ${DEMO_OPERATOR_PASSWORD:demo-password}
knowledge:
  embedding:
    model-id: intfloat/multilingual-e5-small
    model-revision: 0e60b8d9d2166d80387f86e3b48ec9ced55f4d15
    dimensions: 384
    model-sha256: ca456c06b3a9505ddfd9131408916dd79290368331e7d76bb621f1cba6bc8665
    tokenizer-sha256: 0b44a9d7b51c3c62626640cda0e2c2f70fdacdc25bbbd68038369d14ebdf4c39
    model-uri: ${KNOWLEDGE_ONNX_MODEL_URI:https://huggingface.co/intfloat/multilingual-e5-small/resolve/0e60b8d9d2166d80387f86e3b48ec9ced55f4d15/onnx/model.onnx}
    tokenizer-uri: ${KNOWLEDGE_ONNX_TOKENIZER_URI:https://huggingface.co/intfloat/multilingual-e5-small/resolve/0e60b8d9d2166d80387f86e3b48ec9ced55f4d15/onnx/tokenizer.json}
    cache-directory: ${KNOWLEDGE_ONNX_CACHE_DIRECTORY:${java.io.tmpdir}/iot-ota-onnx}
  search:
    top-k: 4
    max-text-length: 600
    similarity-threshold: 0.70
