spring:
  application:
    name: iot-ota-operations-agent
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ota_operations}
    username: ${SPRING_DATASOURCE_USERNAME:ota}
    password: ${SPRING_DATASOURCE_PASSWORD:ota}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
demo:
  operator:
    username: ${DEMO_OPERATOR_USERNAME:demo-operator}
    password: ${DEMO_OPERATOR_PASSWORD:demo-password}
