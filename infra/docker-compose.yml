services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ota_operations
      POSTGRES_USER: ota
      POSTGRES_PASSWORD: ota
    volumes:
      - ota-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ota -d ota_operations"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 768m

  backend:
    build:
      context: ../backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ota_operations
      SPRING_DATASOURCE_USERNAME: ota
      SPRING_DATASOURCE_PASSWORD: ota
      DEMO_OPERATOR_USERNAME: ${DEMO_OPERATOR_USERNAME:-demo-operator}
      DEMO_OPERATOR_PASSWORD: ${DEMO_OPERATOR_PASSWORD:-demo-password}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: ../frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    mem_limit: 256m

volumes:
  ota-postgres-data:
