name: iot-ota-operations-agent

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ota_operations}
      POSTGRES_USER: ${POSTGRES_USER:-ota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ota-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ota} -d ${POSTGRES_DB:-ota_operations}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    shm_size: 128mb
    mem_limit: 640m
    cpus: 0.45
    stop_grace_period: 30s

  backend:
    build:
      context: ../backend
      args:
        HTTP_PROXY: ${DOCKER_HTTP_PROXY:-}
        HTTPS_PROXY: ${DOCKER_HTTPS_PROXY:-}
        NO_PROXY: ${DOCKER_NO_PROXY:-}
        MAVEN_PROXY_HOST: ${DOCKER_MAVEN_PROXY_HOST:-}
        MAVEN_PROXY_PORT: ${DOCKER_MAVEN_PROXY_PORT:-}
    restart: unless-stopped
    init: true
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ota_operations}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ota}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-}
      DEMO_OPERATOR_USERNAME: ${DEMO_OPERATOR_USERNAME:-demo-operator}
      DEMO_OPERATOR_PASSWORD: ${DEMO_OPERATOR_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      DIAGNOSTIC_MODEL_PROVIDER: ${DIAGNOSTIC_MODEL_PROVIDER:-controlled}
      DIAGNOSTIC_MODEL_NAME: ${DIAGNOSTIC_MODEL_NAME:-gemini-3.1-flash-lite}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEMO_LIVE_DIAGNOSIS_DAILY_LIMIT: ${DEMO_LIVE_DIAGNOSIS_DAILY_LIMIT:-20}
      DEMO_LIVE_DIAGNOSIS_PER_MINUTE_LIMIT: ${DEMO_LIVE_DIAGNOSIS_PER_MINUTE_LIMIT:-3}
      DEMO_DATA_RESET_ENABLED: ${DEMO_DATA_RESET_ENABLED:-true}
      DEMO_DATA_RESET_INTERVAL_MS: ${DEMO_DATA_RESET_INTERVAL_MS:-86400000}
      DEMO_DATA_RESET_INITIAL_DELAY_MS: ${DEMO_DATA_RESET_INITIAL_DELAY_MS:-86400000}
      JAVA_TOOL_OPTIONS: ${DOCKER_JAVA_TOOL_OPTIONS:--Xms256m -Xmx1280m -XX:+ExitOnOutOfMemoryError}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 2g
    cpus: 1.05

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/v1/public/diagnostic-summaries || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 128m
    cpus: 0.25

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ota-caddy-data:/data
      - ota-caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2015/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 128m
    cpus: 0.25

volumes:
  ota-postgres-data:
  ota-caddy-data:
  ota-caddy-config:
