name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -f backend/pom.xml test
      - name: Run backend integration tests
        run: mvn -f backend/pom.xml -Pintegration verify
      - name: Print integration test reports on failure
        if: failure()
        run: |
          echo '=== Failsafe reports ==='
          if [ -d backend/target/failsafe-reports ]; then
            find backend/target/failsafe-reports -maxdepth 1 -type f -name '*.txt' -print -exec cat {} \;
          else
            echo 'No backend/target/failsafe-reports directory was created.'
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install --prefix frontend --no-audit --no-fund
      - run: npm --prefix frontend test -- --run
      - run: npm --prefix frontend run build
